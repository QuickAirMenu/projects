<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4F46E5">
<title>غير متصل — iProjects</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/ip-32.png">
<link rel="apple-touch-icon" href="/icons/ip-180.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--brand:#4F46E5;--brand-2:#7C3AED;--ink:#0F172A;--muted:#64748B;--line:#E2E8F0;--card:#FFFFFF}
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 20px;
    font-family:'Cairo',system-ui,-apple-system,sans-serif;color:var(--ink);
    background:
      radial-gradient(760px 420px at 84% -8%, rgba(124,58,237,.10), transparent 62%),
      radial-gradient(620px 380px at 6% 108%, rgba(79,70,229,.10), transparent 62%),
      #F8FAFC;
  }
  .wrap{width:100%;max-width:380px;text-align:center}
  .hero{width:100%;max-width:300px;margin:0 auto 20px;display:block;filter:drop-shadow(0 18px 30px rgba(79,70,229,.14))}

  .chip{
    display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
    padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;color:#475569;margin-bottom:14px;
    box-shadow:0 4px 10px -6px rgba(15,23,42,.12)
  }
  .dot{width:7px;height:7px;border-radius:99px;background:var(--brand);animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}

  h1{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-bottom:8px}
  p{font-size:13.5px;color:var(--muted);line-height:1.85;margin-bottom:22px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
    padding:13px 18px;border:0;border-radius:13px;cursor:pointer;font-family:inherit;
    font-size:14px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,var(--brand),var(--brand-2));
    box-shadow:0 14px 26px -14px rgba(79,70,229,.65);
    transition:transform .15s ease,box-shadow .15s ease
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 18px 30px -14px rgba(79,70,229,.7)}
  .btn:active{transform:none}
  .btn svg{width:15px;height:15px}
  .meta{margin-top:12px;font-size:12px;color:#94A3B8}
  .meta b{color:#64748B;font-weight:700}
  .brand{margin-top:20px;font-size:11px;font-weight:700;color:#A7B2C2;letter-spacing:.08em;text-transform:uppercase}

  @media (prefers-color-scheme: dark){
    body{color:#E2E8F0;background:
      radial-gradient(760px 420px at 84% -8%, rgba(124,58,237,.16), transparent 62%),
      radial-gradient(620px 380px at 6% 108%, rgba(79,70,229,.16), transparent 62%),
      #0B1220}
    .chip{background:#0F172A;border-color:#1E293B;color:#CBD5E1}
    p{color:#94A3B8}
    .meta{color:#64748B}
    .meta b{color:#94A3B8}
    .brand{color:#475569}
  }
  @media (prefers-reduced-motion: reduce){.dot{animation:none;opacity:1}}
</style>
</head>
<body>
  <main class="wrap">
    <svg class="hero" viewBox="0 0 300 180" role="img" aria-label="لا يوجد اتصال">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#4F46E5"/><stop offset="100%" stop-color="#7C3AED"/>
        </linearGradient>
        <radialGradient id="halo" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#7C3AED" stop-opacity=".18"/>
          <stop offset="70%" stop-color="#4F46E5" stop-opacity=".05"/>
          <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#EEF2FF"/><stop offset="100%" stop-color="#F5F3FF"/>
        </linearGradient>
      </defs>

      <ellipse cx="150" cy="92" rx="134" ry="78" fill="url(#halo)"/>

      <!-- project node -->
      <rect x="32" y="54" width="68" height="68" rx="19" fill="#fff" stroke="#E2E8F0" stroke-width="2"/>
      <rect x="47" y="69" width="13" height="13" rx="4" fill="url(#g)"/>
      <rect x="64" y="69" width="13" height="13" rx="4" fill="url(#g)" opacity=".4"/>
      <rect x="47" y="86" width="13" height="13" rx="4" fill="url(#g)" opacity=".4"/>
      <rect x="64" y="86" width="13" height="13" rx="4" fill="url(#g)"/>

      <!-- cloud node -->
      <path d="M212 105c-8.3 0-15-6.4-15-14.2 0-7.4 6-13.6 13.5-14.1 2.3-8.6 10.1-14.9 19.6-14.9 9 0 16.6 5.8 19.2 13.8 7.5.8 13.1 6.8 13.1 14.2 0 8-6.7 14.5-15 14.5H212z"
            fill="url(#soft)" stroke="#C7D2FE" stroke-width="2"/>

      <!-- broken link -->
      <path d="M104 88h32" stroke="url(#g)" stroke-width="3.6" stroke-linecap="round"/>
      <path d="M164 88h32" stroke="url(#g)" stroke-width="3.6" stroke-linecap="round"/>
      <circle cx="146" cy="88" r="4.8" fill="#fff" stroke="url(#g)" stroke-width="2.8"/>
      <circle cx="154" cy="88" r="4.8" fill="#fff" stroke="url(#g)" stroke-width="2.8"/>
      <path d="M143 74l14 28" stroke="url(#g)" stroke-width="3.6" stroke-linecap="round"/>
    </svg>

    <div class="chip"><span class="dot"></span> غير متصل</div>

    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>بياناتك محفوظة بأمان. سنعيد الربط تلقائياً بمجرد عودة الشبكة.</p>

    <button class="btn" onclick="location.reload()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      إعادة المحاولة
    </button>

    <p class="meta" id="meta">إعادة المحاولة التلقائية خلال <b id="cd">5</b> ث</p>
    <div class="brand">iProjects</div>
  </main>

<script>
  (function () {
    var done = false;
    var cd = document.getElementById('cd');
    var meta = document.getElementById('meta');
    var left = 5;

    function refresh() {
      if (done) return;
      done = true;
      if (meta) meta.textContent = 'تم استعادة الاتصال…';
      location.reload();
    }

    window.addEventListener('online', refresh);

    var timer = setInterval(function () {
      if (navigator.onLine === false) return;
      fetch('/health', { cache: 'no-store' })
        .then(function (r) { if (r.ok) refresh(); })
        .catch(function () {});
      left -= 1;
      if (left <= 0) left = 5;
      if (cd) cd.textContent = String(left);
    }, 5000);

    if (navigator.onLine) {
      fetch('/health', { cache: 'no-store' })
        .then(function (r) { if (r.ok) refresh(); })
        .catch(function () {});
    }

    window.addEventListener('pagehide', function () { clearInterval(timer); });
  })();
</script>
</body>
</html>

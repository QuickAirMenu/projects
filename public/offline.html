<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4F46E5">
<title>غير متصل — iProjects</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/ip-32.png">
<link rel="apple-touch-icon" href="/icons/ip-180.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--brand:#4F46E5;--brand2:#7C3AED;--ink:#0F172A;--muted:#64748B;--ok:#059669}
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px 20px;
       font-family:'Cairo',system-ui,-apple-system,sans-serif;color:var(--ink);
       background:radial-gradient(760px 420px at 84% -8%,rgba(124,58,237,.10),transparent 62%),
                  radial-gradient(620px 380px at 6% 108%,rgba(79,70,229,.10),transparent 62%),#F8FAFC}
  .wrap{width:100%;max-width:340px;text-align:center}

  .hero{
    width:172px;height:auto;margin:0 auto 26px;display:block;cursor:pointer;
    filter:drop-shadow(0 20px 32px rgba(79,70,229,.22));
    -webkit-tap-highlight-color:transparent;
    transition:transform .18s ease;
  }
  .hero:active{transform:scale(.97)}
  .hero:focus-visible{outline:3px solid rgba(79,70,229,.4);outline-offset:6px;border-radius:36px}
  .hero .slash{transition:opacity .25s ease, transform .25s ease}
  .hero .left,.hero .right{transition:transform .28s cubic-bezier(.2,.8,.2,1)}
  .hero.connected .slash{opacity:0;transform:rotate(-20deg) scale(.8)}
  .hero.connected .left{transform:translateX(6px)}
  .hero.connected .right{transform:translateX(-6px)}
  .hero.failed{animation:shake .28s ease}
  @keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

  h1{font-size:21px;font-weight:800;letter-spacing:-.01em;margin-bottom:8px}
  .hint{font-size:12px;color:#94A3B8;margin-bottom:24px}

  .retry{
    width:58px;height:58px;border-radius:99px;border:0;cursor:pointer;display:inline-flex;
    align-items:center;justify-content:center;color:#fff;
    background:linear-gradient(135deg,var(--brand),var(--brand2));
    box-shadow:0 16px 28px -14px rgba(79,70,229,.7);
    transition:transform .15s ease;
  }
  .retry:hover{transform:translateY(-2px)}
  .retry:active{transform:none}
  .retry[disabled]{opacity:.6;cursor:default;transform:none}
  .retry svg{width:24px;height:24px}

  .meta{margin-top:14px;font-size:12px;color:#94A3B8}
  .meta b{color:#64748B;font-weight:700}
  .brand{margin-top:22px;font-size:11px;font-weight:700;color:#A7B2C2;letter-spacing:.08em;text-transform:uppercase}

  .success{display:none}
  .success.show{display:block}
  .success .ico{width:58px;height:58px;border-radius:99px;background:#ECFDF5;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
  .success .ico svg{width:28px;height:28px;color:var(--ok)}

  @media (prefers-color-scheme: dark){
    body{color:#E2E8F0;background:radial-gradient(760px 420px at 84% -8%,rgba(124,58,237,.16),transparent 62%),
      radial-gradient(620px 380px at 6% 108%,rgba(79,70,229,.16),transparent 62%),#0B1220}
    .hint{color:#64748B}
    .meta{color:#64748B}.meta b{color:#94A3B8}
    .brand{color:#475569}
  }
  @media (prefers-reduced-motion: reduce){
    .hero,.hero .slash,.hero .left,.hero .right,.hero.failed{transition:none;animation:none}
  }
</style>
</head>
<body>
  <main class="wrap">
    <div id="offlineView">
      <svg class="hero" id="hero" viewBox="0 0 200 200" role="button" tabindex="0"
           aria-label="اضغط لإعادة الربط">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4F46E5"/><stop offset="100%" stop-color="#7C3AED"/>
          </linearGradient>
        </defs>
        <rect x="20" y="20" width="160" height="160" rx="46" fill="url(#g)"/>
        <g class="left" stroke="#fff" stroke-width="9" stroke-linecap="round" fill="none">
          <path d="M74 100h22"/>
        </g>
        <circle class="left" cx="103" cy="100" r="7.5" fill="#fff"/>
        <g class="right" stroke="#fff" stroke-width="9" stroke-linecap="round" fill="none">
          <path d="M112 100h22"/>
        </g>
        <circle class="right" cx="117" cy="100" r="7.5" fill="#fff"/>
        <path class="slash" d="M94 79l20 42" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
      </svg>

      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p class="hint">اضغط الرسمة لإعادة الربط</p>

      <button class="retry" id="retryBtn" aria-label="إعادة المحاولة" title="إعادة المحاولة">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>

      <p class="meta" id="meta">إعادة المحاولة خلال <b id="cd">3</b> ث</p>
      <div class="brand">iProjects</div>
    </div>

    <div id="successView" class="success" aria-live="polite">
      <div class="ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      </div>
      <h1>تم استعادة الاتصال</h1>
    </div>
  </main>

<script>
  (function () {
    var delays = [3, 5, 8, 12, 15];
    var attempt = 0;
    var countdown = delays[0];
    var busy = false;
    var finished = false;

    var hero = document.getElementById('hero');
    var offlineView = document.getElementById('offlineView');
    var successView = document.getElementById('successView');
    var cd = document.getElementById('cd');
    var meta = document.getElementById('meta');
    var btn = document.getElementById('retryBtn');

    function redirect() {
      var path = '/';
      try { path = localStorage.getItem('ip_last_path') || '/'; } catch (e) {}
      if (path.indexOf('/offline.html') === 0) path = '/';
      location.replace(path);
    }

    function success() {
      finished = true;
      hero.classList.add('connected');
      offlineView.style.display = 'none';
      successView.classList.add('show');
      if (meta) meta.textContent = 'جارٍ فتح صفحتك…';
      setTimeout(redirect, 750);
    }

    function fail() {
      hero.classList.remove('connected');
      hero.classList.add('failed');
      setTimeout(function () { hero.classList.remove('failed'); }, 320);
      attempt += 1;
      countdown = delays[Math.min(attempt, delays.length - 1)];
    }

    function probe() {
      if (busy || finished) return;
      busy = true;
      if (btn) btn.disabled = true;
      hero.classList.add('connected');

      var controller = new AbortController();
      var t = setTimeout(function () { controller.abort(); }, 5000);

      fetch('/health', { cache: 'no-store', signal: controller.signal })
        .then(function (r) {
          clearTimeout(t);
          if (r.ok) { success(); return; }
          throw new Error('bad');
        })
        .catch(function () {
          clearTimeout(t);
          fail();
        })
        .then(function () {
          busy = false;
          if (btn) btn.disabled = false;
        });
    }

    setInterval(function () {
      if (finished || busy) return;
      countdown -= 1;
      if (countdown <= 0) { probe(); countdown = delays[0]; }
      if (cd) cd.textContent = String(Math.max(countdown, 0));
    }, 1000);

    function trigger() { attempt = 0; probe(); }

    hero.addEventListener('click', trigger);
    hero.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); trigger(); }
    });
    if (btn) btn.addEventListener('click', trigger);

    window.addEventListener('online', probe);
    probe();
  })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4F46E5">
<title>غير متصل — iProjects</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --brand:#4F46E5; --violet:#7C3AED; --ink:#0F172A; --muted:#64748B; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    font-family:'Cairo',system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);
    background:#F8FAFC;
  }
  .wrap{width:100%;max-width:400px;text-align:center}
  .logo{width:72px;height:72px;border-radius:20px;margin:0 auto 22px;display:block;
    box-shadow:0 16px 32px -16px rgba(79,70,229,.55)}
  h1{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-bottom:8px}
  p{font-size:14px;color:var(--muted);line-height:1.8;margin-bottom:26px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    width:100%;max-width:260px;padding:13px 20px;border:0;border-radius:14px;cursor:pointer;
    font-family:inherit;font-size:14px;font-weight:700;color:#fff;
    background:var(--brand);transition:background .15s ease;
  }
  .btn:hover{background:#4338CA}
  .btn svg{width:16px;height:16px}
  .brand{margin-top:28px;font-size:11.5px;font-weight:700;color:#94A3B8;letter-spacing:.06em;text-transform:uppercase}
</style>
</head>
<body>
  <main class="wrap">
    <img src="/icons/icon-512.png" alt="iProjects" class="logo">
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تحقق من اتصالك ثم أعد المحاولة.</p>
    <button class="btn" onclick="location.reload()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      إعادة المحاولة
    </button>
    <p id="status" style="margin-top:14px;font-size:12px;color:#94A3B8">سيتم التحديث تلقائياً عند عودة الاتصال…</p>
    <div class="brand">iProjects</div>
  </main>

<script>
  (function () {
    var reloading = false;

    function refresh() {
      if (reloading) return;
      reloading = true;
      var st = document.getElementById('status');
      if (st) st.textContent = 'تم استعادة الاتصال، جارٍ التحديث…';
      location.reload();
    }

    // 1) Browser online event (fast, but not always reliable)
    window.addEventListener('online', refresh);

    // 2) Active probe: ping /health every 5s (no cache)
    var timer = setInterval(function () {
      if (navigator.onLine === false) return;
      fetch('/health', { method: 'GET', cache: 'no-store' })
        .then(function (r) { if (r.ok) refresh(); })
        .catch(function () {});
    }, 5000);

    // 3) Try immediately in case connection already returned
    if (navigator.onLine) {
      fetch('/health', { method: 'GET', cache: 'no-store' })
        .then(function (r) { if (r.ok) refresh(); })
        .catch(function () {});
    }

    window.addEventListener('pagehide', function () { clearInterval(timer); });
  })();
</script>
</body>
</html>

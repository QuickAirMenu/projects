<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4F46E5">
<title>غير متصل — iProjects</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/ip-32.png">
<link rel="apple-touch-icon" href="/icons/ip-180.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    font-family:'Cairo',system-ui,-apple-system,sans-serif;color:#0F172A;background:#F8FAFC;
  }
  .box{width:100%;max-width:360px;text-align:center;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){.box{animation:none}}
  img{width:56px;height:56px;border-radius:16px;display:block;margin:0 auto 20px;
      box-shadow:0 10px 24px -14px rgba(79,70,229,.55)}
  h1{font-size:20px;font-weight:800;margin-bottom:8px}
  p{font-size:13.5px;color:#64748B;line-height:1.8;margin-bottom:24px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
    padding:12px 18px;border:0;border-radius:12px;cursor:pointer;font-family:inherit;
    font-size:14px;font-weight:700;color:#fff;background:#4F46E5;transition:background .15s;
  }
  .btn:hover{background:#4338CA}
  .btn svg{width:15px;height:15px}
  .status{margin-top:12px;font-size:12px;color:#94A3B8}
  .brand{margin-top:20px;font-size:11px;font-weight:700;color:#A7B2C2;letter-spacing:.08em;text-transform:uppercase}
</style>
</head>
<body>
  <main class="box">
    <img src="/icons/ip-512.png" alt="iProjects">
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تحقق من اتصالك وسيتم التحديث تلقائياً عند عودته.</p>

    <button class="btn" onclick="location.reload()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      إعادة المحاولة
    </button>

    <p class="status" id="status">إعادة المحاولة كل 5 ثوانٍ…</p>
    <div class="brand">iProjects</div>
  </main>

<script>
  (function () {
    var done = false;
    var statusEl = document.getElementById('status');

    function refresh() {
      if (done) return;
      done = true;
      if (statusEl) statusEl.textContent = 'تم استعادة الاتصال…';
      location.reload();
    }

    window.addEventListener('online', refresh);

    var timer = setInterval(function () {
      if (navigator.onLine === false) return;
      fetch('/health', { cache: 'no-store' })
        .then(function (r) { if (r.ok) refresh(); })
        .catch(function () {});
    }, 5000);

    if (navigator.onLine) {
      fetch('/health', { cache: 'no-store' })
        .then(function (r) { if (r.ok) refresh(); })
        .catch(function () {});
    }

    window.addEventListener('pagehide', function () { clearInterval(timer); });
  })();
</script>
</body>
</html>
